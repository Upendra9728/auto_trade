name: CD — AWS EC2 (aws-prod)

on:
  push:
    branches:
      - aws-prod
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 60s
          command_timeout: 15m

          script: |
            set -euo pipefail

            APP_DIR="/var/www/auto_trade"

            echo "==> Moving to application directory..."
            cd "$APP_DIR"

            echo "==> Pulling latest code from aws-prod..."
            git fetch origin
            git checkout aws-prod
            git reset --hard origin/aws-prod

            echo "==> Clearing Python cache..."
            find backend -type d -name "__pycache__" -exec rm -rf {} + || true

            echo "==> Activating virtual environment..."
            source backend/.venv/bin/activate

            echo "==> Upgrading pip..."
            python -m pip install --upgrade pip

            echo "==> Installing requirements..."
            pip install -r backend/requirements.txt

            deactivate

            echo "==> Restarting backend..."
            sudo systemctl restart automate-backend

            echo "==> Waiting for backend..."

            for i in {1..12}; do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                echo "✅ Backend is healthy."
                exit 0
              fi

              echo "Waiting... ($i/12)"
              sleep 5
            done

            echo "❌ Backend failed health check."

            sudo journalctl -u automate-backend -n 100 --no-pager

            exit 1